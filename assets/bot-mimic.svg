<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Human usercmds recorded and replayed onto bots">
  <rect width="720" height="260" fill="#121820"/>

  <text x="120" y="36" text-anchor="middle" fill="#3dd68c" font-size="13" font-family="Consolas,monospace">you</text>
  <circle cx="120" cy="100" r="22" fill="#2a3340" stroke="#3dd68c" stroke-width="2"/>
  <text x="120" y="104" text-anchor="middle" fill="#3dd68c" font-size="12" font-family="Consolas,monospace">P</text>
  <text x="120" y="150" text-anchor="middle" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">usercmds</text>
  <text x="120" y="168" text-anchor="middle" fill="#8b9aab" font-size="11">move / look / fire</text>

  <path d="M160 100 L280 100" stroke="#8b9aab" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b9aab"/>
    </marker>
  </defs>
  <rect x="280" y="70" width="140" height="60" fill="#1a222c" stroke="#f5d76e" stroke-width="1.5"/>
  <text x="350" y="95" text-anchor="middle" fill="#f5d76e" font-size="11" font-family="Consolas,monospace">history 64</text>
  <text x="350" y="115" text-anchor="middle" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">bot_mimic 1</text>

  <path d="M420 100 L500 70" stroke="#8b9aab" stroke-width="2"/>
  <path d="M420 100 L500 100" stroke="#8b9aab" stroke-width="2"/>
  <path d="M420 100 L500 130" stroke="#8b9aab" stroke-width="2"/>

  <circle cx="540" cy="70" r="16" fill="#2a3340" stroke="#e6edf3" stroke-width="2"/>
  <text x="540" y="74" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Consolas,monospace">B</text>
  <circle cx="540" cy="100" r="16" fill="#2a3340" stroke="#e6edf3" stroke-width="2"/>
  <text x="540" y="104" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Consolas,monospace">B</text>
  <circle cx="540" cy="130" r="16" fill="#2a3340" stroke="#e6edf3" stroke-width="2"/>
  <text x="540" y="134" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Consolas,monospace">B</text>
  <text x="620" y="90" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">same inputs</text>
  <text x="620" y="110" fill="#8b9aab" font-size="11">optional yaw fan</text>
  <text x="620" y="130" fill="#8b9aab" font-size="11">or freeze pin</text>

  <text x="360" y="220" text-anchor="middle" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">debug / strat: bots copy your player state</text>
</svg>
