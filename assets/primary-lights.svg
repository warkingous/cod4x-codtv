<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compiled primary light versus the same light turned off from GSC">
  <rect width="720" height="240" fill="#121820"/>

  <text x="180" y="28" text-anchor="middle" fill="#f5d76e" font-size="13" font-family="Consolas,monospace">compiled</text>
  <rect x="30" y="44" width="300" height="160" fill="rgba(245,215,110,0.05)" stroke="#f5d76e" stroke-width="1" opacity="0.7"/>
  <circle cx="180" cy="110" r="36" fill="#f5d76e" opacity="0.18"/>
  <circle cx="180" cy="110" r="18" fill="#f5d76e" opacity="0.55"/>
  <circle cx="180" cy="110" r="6" fill="#f5d76e"/>
  <text x="180" y="168" text-anchor="middle" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">primary light</text>
  <text x="180" y="186" text-anchor="middle" fill="#8b9aab" font-size="11">baked color and radius</text>

  <text x="540" y="28" text-anchor="middle" fill="#3dd68c" font-size="13" font-family="Consolas,monospace">setlightintensity(0)</text>
  <rect x="390" y="44" width="300" height="160" fill="rgba(61,214,140,0.05)" stroke="#3dd68c" stroke-width="1" opacity="0.7"/>
  <circle cx="540" cy="110" r="6" fill="#3a4654" stroke="#8b9aab" stroke-width="1.5"/>
  <text x="540" y="168" text-anchor="middle" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">same entity</text>
  <text x="540" y="186" text-anchor="middle" fill="#8b9aab" font-size="11">GSC, same calls as SP</text>
</svg>
