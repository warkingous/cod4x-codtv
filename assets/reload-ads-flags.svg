<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Normal ADS flags compared with ADS during reload">
  <rect width="720" height="300" fill="#121820"/>
  <text x="180" y="28" text-anchor="middle" fill="#3dd68c" font-size="13" font-family="Consolas,monospace">normal ADS</text>
  <rect x="40" y="48" width="280" height="220" fill="rgba(61,214,140,0.05)" stroke="#3dd68c" stroke-width="1" opacity="0.4"/>
  <text x="58" y="78" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">PMF_SIGHT_AIMING  0x10</text>
  <rect x="58" y="88" width="244" height="18" fill="#3dd68c"/>
  <text x="58" y="132" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">PMF_WALKING       0x40</text>
  <rect x="58" y="142" width="244" height="18" fill="#3dd68c"/>
  <text x="58" y="186" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">scale</text>
  <text x="58" y="210" fill="#3dd68c" font-size="18" font-family="Consolas,monospace">x 0.4  ~61</text>
  <text x="58" y="248" fill="#8b9aab" font-size="11">zoom and slow. intended.</text>
  <text x="540" y="28" text-anchor="middle" fill="#ff6b6b" font-size="13" font-family="Consolas,monospace">ADS during reload (stock)</text>
  <rect x="400" y="48" width="280" height="220" fill="rgba(255,107,107,0.05)" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
  <text x="418" y="78" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">PMF_SIGHT_AIMING  0x10</text>
  <rect x="418" y="88" width="244" height="18" fill="#f5d76e"/>
  <text x="418" y="132" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">PMF_WALKING       0x40</text>
  <rect x="418" y="142" width="244" height="18" fill="#1e2833" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="510" y="155" fill="#ff6b6b" font-size="11" font-family="Consolas,monospace">cleared</text>
  <text x="418" y="186" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">scale</text>
  <text x="418" y="210" fill="#ff6b6b" font-size="18" font-family="Consolas,monospace">x 1.0  ~152</text>
  <text x="418" y="248" fill="#8b9aab" font-size="11">zoom and hip speed. bug.</text>
</svg>
