<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Official bPositionToADS versus fWeaponPosFrac latch for zoom sensitivity ratio">
  <rect width="720" height="280" fill="#121820"/>

  <text x="180" y="28" text-anchor="middle" fill="#ff6b6b" font-size="13" font-family="Consolas,monospace">official CoD4x</text>
  <rect x="30" y="44" width="300" height="200" fill="rgba(255,107,107,0.05)" stroke="#ff6b6b" stroke-width="1" opacity="0.45"/>
  <text x="48" y="78" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">gate: bPositionToADS == 0</text>
  <text x="48" y="110" fill="#3dd68c" font-size="12" font-family="Consolas,monospace">full ADS     ratio ON</text>
  <text x="48" y="138" fill="#ff6b6b" font-size="12" font-family="Consolas,monospace">zoom-out     ratio still ON</text>
  <text x="48" y="166" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">zoom-in      ratio OFF</text>
  <text x="48" y="194" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">hipfire      ratio OFF</text>
  <text x="48" y="226" fill="#8b9aab" font-size="11">flag only flips at 0.0 / 1.0</text>

  <text x="540" y="28" text-anchor="middle" fill="#3dd68c" font-size="13" font-family="Consolas,monospace">our fix</text>
  <rect x="390" y="44" width="300" height="200" fill="rgba(61,214,140,0.05)" stroke="#3dd68c" stroke-width="1" opacity="0.45"/>
  <text x="408" y="78" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">gate: fWeaponPosFrac latch</text>
  <text x="408" y="110" fill="#3dd68c" font-size="12" font-family="Consolas,monospace">&gt;= 0.995   ratio ON</text>
  <text x="408" y="138" fill="#3dd68c" font-size="12" font-family="Consolas,monospace">&lt;= 0.980   ratio OFF</text>
  <text x="408" y="166" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">mid zoom    holds last state</text>
  <text x="408" y="194" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">hipfire     ratio OFF</text>
  <text x="408" y="226" fill="#8b9aab" font-size="11">no zoom-out false ON</text>
</svg>
