    <text x="430" y="362" fill="#8b949e" font-size="13">Radii are game units, before scale.</text>
    <text x="430" y="410" fill="#e6edf3" font-size="15" font-weight="600">Same colors as</text>
    <text x="430" y="432" fill="#e6edf3" font-size="15">cg_playerHitboxColor 0</text>
