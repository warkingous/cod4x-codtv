  <g font-family="Segoe UI, sans-serif" font-size="15">
    <text x="430" y="48" fill="#e6edf3" font-size="18" font-weight="600">Capsule hitboxes</text>
    <text x="430" y="74" fill="#8b949e" font-size="13">Front view. Thickness is the trace radius.</text>
    <g font-size="14">
      <line x1="430" y1="112" x2="466" y2="112" stroke="#ffd228" stroke-width="14" stroke-linecap="round"/>
