      <line x1="430" y1="146" x2="466" y2="146" stroke="#ff8c28" stroke-width="14" stroke-linecap="round"/>
      <text x="480" y="151" fill="#e6edf3">Neck  3.0</text>
      <line x1="430" y1="180" x2="466" y2="180" stroke="#50dc50" stroke-width="14" stroke-linecap="round"/>
      <text x="480" y="185" fill="#e6edf3">Torso  4.8 to 6.8</text>
      <line x1="430" y1="214" x2="466" y2="214" stroke="#508cff" stroke-width="14" stroke-linecap="round"/>
      <text x="480" y="219" fill="#e6edf3">Right arm  3.3 / 2.7 / 2.2</text>
      <line x1="430" y1="248" x2="466" y2="248" stroke="#b450ff" stroke-width="14" stroke-linecap="round"/>
