<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Official xmodel pool of 1000 versus raised default of 2000">
  <rect width="720" height="220" fill="#121820"/>

  <text x="180" y="28" text-anchor="middle" fill="#ff6b6b" font-size="13" font-family="Consolas,monospace">official default</text>
  <rect x="30" y="44" width="300" height="140" fill="rgba(255,107,107,0.05)" stroke="#ff6b6b" stroke-width="1" opacity="0.45"/>
  <text x="50" y="90" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">XMODEL pool</text>
  <rect x="50" y="105" width="120" height="36" fill="#ff6b6b"/>
  <text x="70" y="129" fill="#121820" font-size="18" font-family="Consolas,monospace">1000</text>
  <text x="50" y="165" fill="#8b9aab" font-size="11">heavy mods can fill it</text>

  <text x="540" y="28" text-anchor="middle" fill="#3dd68c" font-size="13" font-family="Consolas,monospace">our default</text>
  <rect x="390" y="44" width="300" height="140" fill="rgba(61,214,140,0.05)" stroke="#3dd68c" stroke-width="1" opacity="0.45"/>
  <text x="410" y="90" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">XMODEL pool</text>
  <rect x="410" y="105" width="240" height="36" fill="#3dd68c"/>
  <text x="490" y="129" fill="#121820" font-size="18" font-family="Consolas,monospace">2000</text>
  <text x="410" y="165" fill="#8b9aab" font-size="11">2x room for heavy mods</text>
</svg>
