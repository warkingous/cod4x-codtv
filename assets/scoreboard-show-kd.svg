<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scoreboard without K/D column versus with K/D column">
  <rect width="720" height="240" fill="#121820"/>

  <text x="180" y="28" text-anchor="middle" fill="#ff6b6b" font-size="13" font-family="Consolas,monospace">cg_scoreboardShowKD 0</text>
  <rect x="30" y="44" width="300" height="160" fill="rgba(255,107,107,0.05)" stroke="#ff6b6b" stroke-width="1" opacity="0.45"/>
  <rect x="50" y="70" width="260" height="100" fill="#1a222c" stroke="#3a4654" stroke-width="1"/>
  <text x="60" y="95" fill="#8b9aab" font-size="10" font-family="Consolas,monospace">NAME   K   D   SCORE</text>
  <text x="60" y="120" fill="#e6edf3" font-size="11" font-family="Consolas,monospace">Player  12  4    240</text>
  <text x="50" y="190" fill="#8b9aab" font-size="11">stock columns only</text>

  <text x="540" y="28" text-anchor="middle" fill="#3dd68c" font-size="13" font-family="Consolas,monospace">cg_scoreboardShowKD 1</text>
  <rect x="390" y="44" width="300" height="160" fill="rgba(61,214,140,0.05)" stroke="#3dd68c" stroke-width="1" opacity="0.45"/>
  <rect x="410" y="70" width="260" height="100" fill="#1a222c" stroke="#3a4654" stroke-width="1"/>
  <text x="420" y="95" fill="#8b9aab" font-size="10" font-family="Consolas,monospace">NAME   K   D   K/D  SCORE</text>
  <text x="420" y="120" fill="#e6edf3" font-size="11" font-family="Consolas,monospace">Player  12  4  3.00  240</text>
  <text x="410" y="190" fill="#8b9aab" font-size="11">extra K/D column</text>
</svg>
