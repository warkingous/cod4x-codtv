<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bullet detonates a live frag. Thrower keeps the kill. Shooter gets score.">
  <rect width="720" height="240" fill="#121820"/>

  <text x="180" y="28" text-anchor="middle" fill="#ff6b6b" font-size="13" font-family="Consolas,monospace">stock</text>
  <rect x="30" y="44" width="300" height="160" fill="rgba(255,107,107,0.05)" stroke="#ff6b6b" stroke-width="1" opacity="0.7"/>
  <line x1="70" y1="120" x2="250" y2="100" stroke="#8b9aab" stroke-width="2"/>
  <circle cx="160" cy="110" r="16" fill="#2a3340" stroke="#f5d76e" stroke-width="2"/>
  <text x="160" y="114" text-anchor="middle" fill="#f5d76e" font-size="10" font-family="Consolas,monospace">frag</text>
  <text x="180" y="168" text-anchor="middle" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">bullet hits, fuse only</text>
  <text x="180" y="186" text-anchor="middle" fill="#8b9aab" font-size="11">takedamage off</text>

  <text x="540" y="28" text-anchor="middle" fill="#3dd68c" font-size="13" font-family="Consolas,monospace">50 HP, then explode</text>
  <rect x="390" y="44" width="300" height="160" fill="rgba(61,214,140,0.05)" stroke="#3dd68c" stroke-width="1" opacity="0.7"/>
  <line x1="420" y1="130" x2="500" y2="108" stroke="#3dd68c" stroke-width="2"/>
  <circle cx="520" cy="104" r="22" fill="#f5d76e" opacity="0.25"/>
  <circle cx="520" cy="104" r="8" fill="#f5d76e"/>
  <text x="540" y="158" text-anchor="middle" fill="#8b9aab" font-size="12" font-family="Consolas,monospace">thrower keeps the kill</text>
  <text x="540" y="178" text-anchor="middle" fill="#3dd68c" font-size="12" font-family="Consolas,monospace">shooter +3 score</text>
</svg>
