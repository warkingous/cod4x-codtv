<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Follow-player freelook versus CS-style locked orbit base">
  <rect width="720" height="260" fill="#121820"/>

  <text x="180" y="28" text-anchor="middle" fill="#f5d76e" font-size="13" font-family="Consolas,monospace">FreeLookCS 0 follow</text>
  <rect x="30" y="44" width="300" height="180" fill="rgba(245,215,110,0.05)" stroke="#f5d76e" stroke-width="1" opacity="0.45"/>
  <circle cx="120" cy="130" r="14" fill="#2a3340" stroke="#e6edf3" stroke-width="2"/>
  <text x="120" y="134" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Consolas,monospace">P</text>
  <path d="M120 130 L210 90" stroke="#f5d76e" stroke-width="2" fill="none"/>
  <circle cx="210" cy="90" r="8" fill="none" stroke="#3dd68c" stroke-width="2"/>
  <text x="50" y="200" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">base = player yaw/pitch</text>
  <text x="50" y="218" fill="#8b9aab" font-size="11">orbit turns with them</text>

  <text x="540" y="28" text-anchor="middle" fill="#3dd68c" font-size="13" font-family="Consolas,monospace">FreeLookCS 1 CS lock</text>
  <rect x="390" y="44" width="300" height="180" fill="rgba(61,214,140,0.05)" stroke="#3dd68c" stroke-width="1" opacity="0.45"/>
  <circle cx="480" cy="130" r="14" fill="#2a3340" stroke="#e6edf3" stroke-width="2"/>
  <text x="480" y="134" text-anchor="middle" fill="#e6edf3" font-size="10" font-family="Consolas,monospace">P</text>
  <path d="M480 130 L570 90" stroke="#3dd68c" stroke-width="2" fill="none"/>
  <circle cx="570" cy="90" r="8" fill="none" stroke="#3dd68c" stroke-width="2"/>
  <path d="M500 150 L540 170" stroke="#8b9aab" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="410" y="200" fill="#8b9aab" font-size="11" font-family="Consolas,monospace">base = world seed</text>
  <text x="410" y="218" fill="#8b9aab" font-size="11">player turn does not drag cam</text>
</svg>
